# ====================================================================
# cPanel Pro & WHMCS High-Performance Nginx Reverse Proxy Configuration
# ====================================================================

# 1. cPanel User Interface (Port 2083)
server {
    listen 2083 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/certs/cpanel-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/cpanel-selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Static React Frontend assets
    location /assets/ {
        alias /var/www/cpanel/frontend/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # API & WebSocket Proxy to Node.js backend (Port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WHM API 1 Endpoint for WHMCS
    location /json-api/ {
        proxy_pass http://127.0.0.1:5000/json-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Direct Single Sign-On cPanel sessions
    location ~* ^/cpsess_([a-zA-Z0-9]+)/ {
        rewrite ^/cpsess_([a-zA-Z0-9]+)/(.*)$ /?session=cpsess_$1&$2 break;
        proxy_pass http://127.0.0.1:5000;
    }

    # Fallback to SPA Frontend
    location / {
        root /var/www/cpanel/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
}

# 2. WHM Root Management Interface (Port 2087)
server {
    listen 2087 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/certs/cpanel-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/cpanel-selfsigned.key;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
